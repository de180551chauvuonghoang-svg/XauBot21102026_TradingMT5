# config/symbols.yaml
# Danh mục tài sản MultiAssetEA v2
# ⚠️ Kiểm tra suffix với broker của bạn (.m, .pro, .ecn, v.v.)

symbols:
  - name: XAUUSD
    suffix: ""
    description: "Vàng / USD"
    sessions: [london, newyork]
    strategies: [trend, breakout]   # Mean reversion ít phù hợp với Gold (biến động lớn)
    max_spread_points: 40
    contract_size: 100              # 1 lot = 100 oz vàng

  - name: EURUSD
    suffix: ""
    description: "Euro / USD"
    sessions: [london, newyork]
    strategies: [trend, breakout, mean_reversion]
    max_spread_points: 15
    contract_size: 100000

  - name: GBPUSD
    suffix: ""
    description: "Bảng Anh / USD"
    sessions: [london, newyork]
    strategies: [trend, breakout, mean_reversion]
    max_spread_points: 20
    contract_size: 100000

  - name: USDJPY
    suffix: ""
    description: "USD / Yên Nhật"
    sessions: [tokyo, london, newyork]
    strategies: [trend, mean_reversion]
    max_spread_points: 15
    contract_size: 100000

  - name: US30
    suffix: ""
    description: "Dow Jones Industrial Average"
    sessions: [newyork]
    strategies: [trend, breakout]
    max_spread_points: 30
    contract_size: 1                # Mini CFD

  - name: NAS100
    suffix: ""
    description: "Nasdaq 100"
    sessions: [newyork]
    strategies: [trend, breakout]
    max_spread_points: 30
    contract_size: 1

    contract_size: 100              # barrels

  - name: AUDUSD
    suffix: ""
    description: "AUD / USD"
    sessions: [tokyo, london, newyork]
    strategies: [trend, breakout]
    max_spread_points: 20
    contract_size: 100000
    lot_min: 0.01
    lot_step: 0.01

  - name: NZDUSD
    suffix: ""
    description: "NZD / USD"
    sessions: [tokyo, london]
    strategies: [trend, mean_reversion]
    max_spread_points: 25
    contract_size: 100000
    lot_min: 0.01
    lot_step: 0.01

  - name: USDCAD
    suffix: ""
    description: "USD / CAD"
    sessions: [london, newyork]
    strategies: [trend, breakout]
    max_spread_points: 20
    contract_size: 100000
    lot_min: 0.01
    lot_step: 0.01

# Thông số Broker MetaQuotes-Demo
broker_spec:
  server_utc_offset_hours: 3 # Giờ broker hiện tại UTC+3
  demo_account:
    login: 114393008
    balance: 500.0
    leverage: 100
    type: "hedged"

# Phiên giao dịch (giờ UTC)
sessions:
  tokyo:
    start: "00:00"
    end:   "09:00"
  london:
    start: "07:00"
    end:   "16:00"
  newyork:
    start: "13:00"
    end:   "22:00"

# Tránh rollover
rollover_avoid:
  start: "23:30"
  end:   "00:30"
